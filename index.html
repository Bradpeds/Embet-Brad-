<div id="app"></div>
<script>
let AK    = '';   // loaded from localStorage on init
const OB  = 'https://api.the-odds-api.com/v4';
const BKS = 'pinnacle,draftkings,fanduel,betmgm,caesars,pointsbetus,betrivers,williamhill_us';
const START  = 'June 17, 2026';
const FLAT   = 10;
const H72    = 72  * 60 * 60 * 1000;
const HFAR   = 14  * 24 * 60 * 60 * 1000;
const STALE_MS = 4 * 60 * 60 * 1000;
const MIN_CB = 3;
const DEFAULT_MIN_EDGE   = 0.015;
const DEFAULT_TOP_N      = 3;
const MIN_EDGE_FLOOR = 0.005, MIN_EDGE_CEIL = 0.05;
const TOP_N_FLOOR = 1, TOP_N_CEIL = 20;
// Optional personal risk cap: hides plays beyond a max |odds| the person
// chooses. Off by default (null = unlimited) -- nothing changes for anyone
// who doesn't touch this. Long-shot mispricings are the ones sportsbooks are
// laziest about repricing, which cuts both ways: more likely to be stale
// data, but also sometimes where genuine value hides. Rather than bake a
// hard cutoff into the core edge/confidence math, this is a display filter
// the person opts into -- the underlying scan still detects everything, and
// the odds-band calibration table keeps collecting real evidence on the far
// end regardless of whether it's currently hidden from view.
const MAX_ODDS_FLOOR = 200, MAX_ODDS_CEIL = 3000;
const maxOddsCap = () => st.settings?.maxOddsCap ?? null;
// PHASE 0 (2.4): `edge` is now a probability gap (percentage points), not an
// EV fraction, so the sanity cap has to be restated in the new unit. The old
// 0.20 meant "20% expected value", which at +300 was only a 5pp price
// disagreement; as a probability gap, 0.20 would be so loose it would never
// fire. A 10pp gap between a sharp reference and a soft book essentially never
// occurs for real -- above that it is a data artifact, not a play.
const SANITY_EDGE = 0.10;
// A quote is only evidence while the book is still standing behind it. The
// Odds API reports when it last saw each book move; nothing read it until now,
// which made a dead line indistinguishable from a live disagreement. The cutoff
// is deliberately far out: it exists to reject quotes that are certainly dead,
// not to guess where "stale" begins. Every pick records its own quote age from
// entry schema 6, so the data can eventually answer that.
const QUOTE_MAX_AGE_MS = 12 * 60 * 60 * 1000;
// How far ahead the scanner is willing to price a market with no sharp book
// quoting it. Beyond this the soft books are posting placeholders rather than
// opinions, and averaging three placeholders produces a fair value that reads
// exactly like a real one. Chosen from an empty gap in the data between 3.1 and
// 9.1 days, and deliberately more permissive than Pinnacle, whose furthest-out
// price anywhere in the dataset was 5.1 days. Picks anchored to a sharp book
// are unaffected at any distance.
const FALLBACK_MAX_LOOKAHEAD_MS = 7 * 24 * 60 * 60 * 1000;
const MIN_SCORED = 10;
// Cached scan blobs are keyed by schema version: pre-patch blobs hold `edge`
// in EV units and would render as probability points if reused.
const PICKS_KEY = () => 'embet_picks_v4_' + today();
// Wait this long past kickoff before writing an unverifiable fallback close,
// so captureClosing() gets real chances at the market first.
const FINALIZE_GRACE_MS = 24 * 60 * 60 * 1000;
// Rough paired-sample target before the Layer 1 vs Layer 2 difference means
// anything. Instrumentation now; a readable answer is months away.
const LAYER_TARGET_BATCHES = 150;
const KELLY_FRACTION = 0.25;
const SAMPLE_EARLY       = 30;
const SAMPLE_DEVELOPING  = 100;
const SAMPLE_MEANINGFUL  = 250;
const CLAMP = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const minEdge = () => st.settings?.minEdge ?? DEFAULT_MIN_EDGE;
const topN    = () => st.settings?.topN    ?? DEFAULT_TOP_N;
const AI_FINALISTS = 4;
const DEFAULT_AI_MODELS = ['claude','gpt4o','gemini','deepseek'];
const MODELS = {
  claude:   { id:'claude',   name:'Claude',   provider:'anthropic', model:'claude-sonnet-4-6',          hasSearch:true  },
  gpt4o:    { id:'gpt4o',    name:'GPT-4o',   provider:'openai',    model:'gpt-4o',                     hasSearch:false },
  gemini:   { id:'gemini',   name:'Gemini',   provider:'google',    model:'gemini-2.5-flash',           hasSearch:false },
  deepseek: { id:'deepseek', name:'DeepSeek', provider:'deepseek',  model:'deepseek-chat',              hasSearch:false }
};
const getWorkerUrl = () => LS.get('embet_worker_url') || '';
const getAiModels  = () => LS.get('embet_ai_models') || DEFAULT_AI_MODELS;
const PRI = [
  'baseball_mlb','basketball_nba','icehockey_nhl',
  'americanfootball_nfl','americanfootball_ncaaf',
  'basketball_ncaab','basketball_wnba',
  'soccer_usa_mls','soccer_epl'
];
const PINNACLE_DEEP = new Set([
  'baseball_mlb','basketball_nba','icehockey_nhl','americanfootball_nfl','soccer_epl'
]);
const tD  = o => o > 0 ? o/100+1 : 100/Math.abs(o)+1;
const iP  = o => 1/tD(o);
const tA  = d => d >= 2 ? Math.round((d-1)*100) : Math.round(-100/(d-1));
const cEV = (f,o) => f*(tD(o)-1)-(1-f);
const cCLV = (yourLine, closeLine) => iP(closeLine) - iP(yourLine);
function kellyStake(fairProb, americanOdds, bankroll) {
  if (!bankroll || bankroll <= 0) return null;
  const b = tD(americanOdds) - 1;
  const fStar = fairProb - (1 - fairProb) / b;
  return bankroll * Math.max(0, fStar) * KELLY_FRACTION;
}
function stdev(arr, mean) {
  if (arr.length < 2) return null;
  const v = arr.reduce((s, x) => s + (x - mean) ** 2, 0) / (arr.length - 1);
  return Math.sqrt(v);
}
function eventClusterSE(rows, mean) {
  if (mean == null || rows.length < 2) return null;
  const sums = new Map();
  for (const p of rows) {
    const k = p.gameId || p.game;
    sums.set(k,(sums.get(k) || 0) + cCLV(p.line,p.closingLine) - mean);
  }
  const g = sums.size;
  // Normal approximation only displayed with at least 30 event clusters.
  if (g < 30) return null;
  return Math.sqrt(g/(g-1) * [...sums.values()].reduce((a,x)=>a+x*x,0) / rows.length**2);
}
function sampleNote(n) {
  return n ? `${n} unique wagers with observed pregame proxies. This measures same-book implied-probability movement, including changes in margin. Intervals require at least 30 event clusters; positive CLV alone does not establish profitability.` : 'No eligible pregame closes yet. Saved bet results remain in your history.';
}
function shinProb(q1, q2) {
  const Q = q1 + q2;
  const pAt = (z, qi) => z >= 1
    ? (qi*qi) / Q
    : (Math.sqrt(z*z + 4*(1-z)*qi*qi/Q) - z) / (2*(1-z));
  const f = z => pAt(z, q1) + pAt(z, q2) - 1;
  let lo = 0, hi = 0.999999, flo = f(lo);
  if (flo <= 0 || flo * f(hi) > 0) return [q1/Q, q2/Q];

// which admitted two classes of bad row:
//
//   (a) Fabricated closes. finalizeStalePending() assigned
//       closingLine = latestLine ?? line, and for any pick where the app was
//       not reopened between detection and kickoff, latestLine still equalled
//       the entry line -- so cCLV(line, line) === 0. Those synthetic zeroes
//       entered the headline average, the 95% CI, all four calibration tables
//       and the model leaderboard, shrinking every result toward zero while
//       inflating N.
//
//   (b) Duplicates. The scan emits one row per (game x market x outcome x
//       book), so the same wager offered at DraftKings and FanDuel produced
//       two near-perfectly correlated observations. clvSE = sd/sqrt(n) assumes
//       independence, so duplicates made the interval too narrow.

    validOdds(p.line) && validOdds(p.closingLine) && p.closingLine === e.price &&
    Number.isFinite(start) && Number.isFinite(quote) && Number.isFinite(observed) &&
    quote <= observed && observed < start && start - quote <= CLOSE_WINDOW_MS &&

    const prev = byKey.get(k);
    // Collapse duplicates to the most favorable price actually obtainable.

    if (p.closeSource === 'fallback') { fallback++; continue; }
    if (p.closeSource === 'captured') {

const MKT_KEY = { ML: 'h2h', Spread: 'spreads', Total: 'totals' };
function persistRecords() {
  LS.set('embet_pending', st.pending);
  LS.set('embet_history', st.history);
}
function captureClosing(g) {
  const now = Date.now(), start = Date.parse(g.commence_time);
  if (!Number.isFinite(start)) return;
  let changed = false;
  for (const p of [...st.pending, ...st.history].filter(p => p.gameId === g.id)) {
    // A schedule change invalidates the previously collected close evidence.
    if (Date.parse(p.commenceTime) !== start) {
      p.commenceTime = g.commence_time;
      delete p.preClose;
      if (p.closeSource === 'captured') p.closeSource = 'legacy';
      changed = true;
    }
    if (now >= start || p.closingLine != null) continue;
    const bm = g.bookmakers?.find(b => (b.title || b.key) === p.book);
    const market = bm?.markets?.find(m => m.key === MKT_KEY[p.mkt]);
    const out = market?.outcomes?.find(o => p.bet === `${o.name}${o.point != null ? ` (${o.point > 0 ? '+' : ''}${o.point})` : ''}`);
    const quoteAt = market?.last_update || bm?.last_update;
    const qt = Date.parse(quoteAt);
    if (!out || !validOdds(out.price) || !Number.isFinite(qt) || qt > now) continue;
    p.latestLine = out.price;
    p.latestLineAt = new Date(now).toISOString();
    if (start - qt <= CLOSE_WINDOW_MS && (!p.preClose || qt >= Date.parse(p.preClose.quoteAt))) {
      p.preClose = { method:'observed-pregame-v1', quoteAt,
        observedAt:new Date(now).toISOString(), price:out.price,
        gameId:p.gameId, mkt:p.mkt, bet:p.bet, book:p.book };
    }
    changed = true;
  }
  if (changed) persistRecords();
}
function finalizeStalePending() {
  const now = Date.now();
  let changed = false;
  for (const p of [...st.pending, ...st.history]) {
    if (p.closingLine != null) continue;
    const start = Date.parse(p.commenceTime);
    if (!Number.isFinite(start) || now < start) continue;
    const candidate = { ...p, closingLine:p.preClose?.price,
      closeSource:'captured', closeEvidence:p.preClose };
    if (isCapturedClose(candidate)) {
      p.closingLine = candidate.closingLine;
      p.closeEvidence = { ...p.preClose };
      p.closeSource = 'captured';
    } else if (now - start >= FINALIZE_GRACE_MS) {
      // Preserve the old fallback display, but never score it.
      p.closingLine = p.latestLine ?? p.line;
      p.closeSource = 'fallback';
    } else continue;
    p.closingAt = new Date(now).toISOString();
    p.lineFinalized = true;
    changed = true;
  }
  if (changed) persistRecords();
}

function mergePending(pick) {
  if (!pick) return null;
  const existing = [...st.pending, ...st.history].find(p =>
    p.gameId === pick.gameId && p.mkt === pick.mkt && p.bet === pick.bet && p.book === pick.book);
  if (existing) {
    if (!existing.sportKey && pick.sportKey) existing.sportKey = pick.sportKey;
    return { ...pick, id:existing.id, result:existing.result };
  }
  const entry = { ...pick, detectedAt:new Date().toISOString(), entrySchema:6,
    latestLine:pick.line, latestLineAt:new Date().toISOString(),
    closingLine:null, closingAt:null, closeSource:'none', lineFinalized:false };
  st.pending.push(entry);
  return { ...entry };
}
async function scan() {
  if (!AK) { st.offlineHistory = false; st.loading = false; render(); return; }
  if (st.scanning) return;
  st.scanning = true;
  try {
    const sRes = await fetch(`${OB}/sports/?apiKey=${AK}`);
    if (!sRes.ok) throw new Error(`Sports list error ${sRes.status}. Check the API key.`);
    const allSports = await sRes.json();

    const active = allSports.filter(s => s.active && !s.has_outrights);
    const sorted = [
      ...PRI.filter(k => active.find(s => s.key === k)),
      ...active.filter(s => !PRI.includes(s.key)).map(s => s.key)
    ].slice(0, 8);

    const scannedGames = [];
    const opps = [];
    const failedSports = [];

    for (const sport of sorted) {
      const url = new URL(`${OB}/sports/${sport}/odds/`);
      url.searchParams.set('apiKey',     AK);
      url.searchParams.set('regions',    'us');
      url.searchParams.set('markets',    'h2h,spreads,totals');
      url.searchParams.set('oddsFormat', 'american');
      url.searchParams.set('bookmakers',  BKS);

      const res = await fetch(url.toString());
      if (!res.ok) {
        if (res.status === 429) throw new Error('API quota reached for this period.');
        failedSports.push({ sport, status: res.status });
        continue;
      }

      const games    = await res.json();
      scannedGames.push(...games);
      const now      = new Date();
      const sportLbl = allSports.find(s => s.key === sport)?.title || sport;

      for (const g of games) {
        captureClosing(g);
        if (new Date(g.commence_time) <= now) continue;

        const pin = g.bookmakers.find(b => b.key === 'pinnacle');
        const oKey = (name, point) => point != null ? `${name}|${point}` : name;

        for (const mkt of ['h2h', 'spreads', 'totals']) {
          const pm = pin?.markets?.find(m => m.key === mkt);
          let fm = null, sharpRef = false;
          // Set only on the fallback path: builds a reference for one book out
          // of every OTHER book, so a price never votes on its own fairness.
          let devigExcluding = null;
          const meta = {};

          if (pm?.outcomes?.length === 2) {
            const [a, b] = pm.outcomes;
            const [fa, fb] = shinProb(iP(a.price), iP(b.price));
            fm = { [oKey(a.name, a.point)]: fa, [oKey(b.name, b.point)]: fb };
            sharpRef = true;
            const sideKeys = [oKey(a.name, a.point), oKey(b.name, b.point)];
            const soft = {};
            for (const key of sideKeys) {
              const ips = [];
              for (const bm of g.bookmakers) {
                if (bm.key === 'pinnacle') continue;
                const m2 = bm.markets?.find(m => m.key === mkt);
                const o2 = m2?.outcomes?.find(o => oKey(o.name, o.point) === key);
                if (o2 && o2.price != null) ips.push(iP(o2.price));
              }
              const mean = ips.length ? ips.reduce((s,x)=>s+x,0)/ips.length : null;
              const disp = (ips.length >= 2 && mean != null) ? Math.sqrt(ips.reduce((s,x)=>s+(x-mean)**2,0)/(ips.length-1)) : null;
              soft[key] = { ips, mean, disp };
            }
            // De-vig the soft consensus so it is comparable with the de-vigged
            // Pinnacle number. Comparing a de-vigged value against a vigged one
            // just measures the margin, which is what the old pinAlign did.
            let consProb = {};
            const mA = soft[sideKeys[0]].mean, mB = soft[sideKeys[1]].mean;
            if (mA != null && mB != null && mA + mB > 1 && mA > 0 && mB > 0) {
              const [cA, cB] = shinProb(mA, mB);
              consProb = { [sideKeys[0]]: cA, [sideKeys[1]]: cB };
            }
            for (const key of sideKeys) {
              meta[key] = { nBooks: soft[key].ips.length, disp: soft[key].disp,
                            pinProb: key === sideKeys[0] ? iP(a.price) : iP(b.price),
                            consProb: consProb[key] ?? null };
            }
          } else if (Date.parse(g.commence_time) - now.getTime() <= FALLBACK_MAX_LOOKAHEAD_MS) {
            // No sharp reference. Allowed only for games close enough that the
            // soft books are quoting seriously — see FALLBACK_MAX_LOOKAHEAD_MS.
            //
            // PHASE 2: quotes carry their book, so the pool can be rebuilt
            // without whichever book is being priced against it.
            const pools = {};
            for (const bm of g.bookmakers) {
              const m2 = bm.markets?.find(m => m.key === mkt);
              if (!m2?.outcomes || m2.outcomes.length !== 2) continue;
              for (const o of m2.outcomes) {
                const k = oKey(o.name, o.point);
                if (!pools[k]) pools[k] = { point: o.point, quotes: [] };
                pools[k].quotes.push({ book: bm.key, price: o.price });
              }

            const byPoint = {};
            for (const k in pools) {
              const pk = String(mkt === 'spreads' ? Math.abs(pools[k].point) : pools[k].point);
              (byPoint[pk] ||= []).push(k);
            }
            let bestKeys = null, bestCount = 0;
            for (const pk in byPoint) {
              const keys = byPoint[pk];
              if (keys.length !== 2) continue;
              if (mkt === 'spreads' && (pools[keys[0]].point !== -pools[keys[1]].point || keys[0].split('|')[0] === keys[1].split('|')[0])) continue;
              const count = keys.reduce((s, k) => s + pools[k].quotes.length, 0);
              if (count > bestCount) { bestCount = count; bestKeys = keys; }
            }
            if (bestKeys) {
              const [k1, k2] = bestKeys;
              // MIN_CB now applies to the pool MINUS the book being priced, so a
              // three-book market stops producing picks. Two books are not a
              // consensus, and most of the fallback cohort was running on three.
              devigExcluding = (bookKey) => {
                const side = k => pools[k].quotes.filter(q => q.book !== bookKey).map(q => q.price);
                const a = side(k1), b = side(k2);
                if (a.length < MIN_CB || b.length < MIN_CB) return null;
                const pA = robustProb(a), pB = robustProb(b);
                if (pA == null || pB == null) return null;
                const [sA, sB] = shinProb(pA, pB);
                const mk = prices => {
                  const ips = prices.map(iP);
                  const mean = ips.reduce((s,x)=>s+x,0)/ips.length;
                  const disp = ips.length >= 2 ? Math.sqrt(ips.reduce((s,x)=>s+(x-mean)**2,0)/(ips.length-1)) : null;
                  // nBooks is the leave-one-out count: the evidence actually
                  // behind this number, not the size of the room.
                  return { nBooks: ips.length, disp, pinProb: null, consProb: null };

            if (!m?.outcomes) continue;

            // Freshness: the market's own stamp when it has one, else the
            // book's. A quote old enough to be dead is not a disagreement.
            const quoteAt = m.last_update || bm.last_update || null;
            const quoteAgeMs = quoteAt ? (now.getTime() - Date.parse(quoteAt)) : null;

            const ref = devigExcluding ? devigExcluding(bm.key) : null;
            if (devigExcluding && !ref) continue;
            const fmB   = ref ? ref.fm   : fm;
            const metaB = ref ? ref.meta : meta;

            for (const o of m.outcomes) {
              const fair = fmB[oKey(o.name, o.point)];
              if (!Number.isFinite(fair) || fair <= 0 || fair >= 1 || !validOdds(o.price)) continue;
              // PHASE 0 (2.4): cEV() reduces algebraically to
              //   fair*d - 1 = (fair - 1/d) * d = probability gap x decimal odds

              // a 1.00pp gap to clear 1.5%, a +300 longshot only 0.38pp. That

              // incoherent, since cCLV() is measured in probability points

              const edgeEV   = cEV(fair, o.price);

              const oppKey = oKey(o.name, o.point);
              const base = {
                id:           uid(),
                gameId:       g.id,
                sport:        sportLbl,
                sportKey:     sport,
                game:         `${g.away_team} @ ${g.home_team}`,
                commenceTime: g.commence_time,
                mkt:          mktLbl,
                bet:          `${o.name}${pt}`,
                book:         bm.title || bm.key,
                line:         o.price,
                fairOdds:     tA(1 / fair),
                fairProb:     fair,
                edge:         edgeProb,   // primary unit: probability points
                edgeProb,
                edgeEV,                   // retained for stake sizing / analysis
                sharp:        sharpRef,
                pinnacleDeep: PINNACLE_DEEP.has(sport),
                suspicious:   edgeProb > SANITY_EDGE,
                confMeta:     metaB[oppKey] || { nBooks: null, disp: null, pinProb: null, consProb: null },
                confVersion:  2,
                quoteAgeMs,               // null when the book reported no stamp
                closingLine:  null,
                closingAt:    null,
                closeSource:  'none',
                result:       null
              };
              base.confidence = quantConfidence(base).score;
              opps.push(base);
            }
          }
        }
      }
    }

    const rankScore = o => {
      const edgeNorm = CLAMP(o.edge / SANITY_EDGE, 0, 1);
      const c = (o.confidence != null) ? o.confidence : 0.5;
      return 0.60*edgeNorm + 0.40*c;
    };
    opps.sort((a, b) => rankScore(b) - rankScore(a));

    const now     = Date.now();
    const cut72h  = now + H72;
    const cutFar  = now + HFAR;

    const passesOddsCap = o => {
      const cap = maxOddsCap();
      // ENTRY SCHEMA 5: a ceiling on price, not on distance from even money.
      // A negative line is a favourite, never a longshot, so it always passes.
      return cap == null || o.line <= cap;
    };
    const nearOpps   = opps.filter(o => !o.suspicious && passesOddsCap(o) && new Date(o.commenceTime).getTime() <= cut72h);
    const futureOpps = opps.filter(o => {
      if (o.suspicious || !passesOddsCap(o)) return false;
      const t = new Date(o.commenceTime).getTime();
      return t > cut72h && t <= cutFar;
    });
    const flaggedAll = opps.filter(o => o.suspicious);
    const flagged = flaggedAll.slice(0, 3);
    const farOpps = opps.filter(o => !o.suspicious && passesOddsCap(o) && new Date(o.commenceTime).getTime() > cutFar);
    // Plays that exist but are hidden purely by the odds cap -- tracked
    // separately so the "N found, M shown" messaging can be honest about
    // why, the same way it already is for topN truncation.
    const oddsCappedCount = opps.filter(o => !o.suspicious && !passesOddsCap(o)).length;

    // Track the full non-suspicious research cohort independently of display limits.
    const tracked = new Map(opps.filter(o => !o.suspicious).map(o => {
      const p = mergePending(o); return [o.id, p];
    }));
    const researchFinalists = finalistPoolFromPicks({researchFinalists:
      [...nearOpps,...futureOpps].map(o => tracked.get(o.id))});
    const near = nearOpps
      .slice(0, topN())
      .map(o => ({...tracked.get(o.id), horizon:'near'}));
    const future = futureOpps
      .slice(0, topN())
      .map(o => ({...tracked.get(o.id), horizon:'future'}));
    LS.set('embet_pending', st.pending);

    const nearTruncated   = Math.max(0, nearOpps.length - near.length);
    const futureTruncated = Math.max(0, futureOpps.length - future.length);
    const far = farOpps
      .slice(0, topN())
      .map(o => ({...tracked.get(o.id), horizon:'far'}));
    persistRecords();
    const farTruncated = Math.max(0, farOpps.length - far.length);
    const hiddenCount = farTruncated
      + Math.max(0, flaggedAll.length - flagged.length)
      + nearTruncated
      + futureTruncated
      + oddsCappedCount;

    const picks = {
      date:        today(),
      generatedAt: new Date().toISOString(),
      opportunities: [...tracked.values()],
      researchFinalists,
      near,
      future,
      far,
      flagged,
      total:        opps.length,
      sportsTried:  sorted.length,
      sportsFailed: failedSports,
      hidden:       hiddenCount,
      nearTruncated,
      futureTruncated,
      farTruncated
    };

    st.picks = picks;
    LS.set(PICKS_KEY(), picks);

    scannedGames.forEach(captureClosing);
    finalizeStalePending();

    const aiFinalists = finalistPoolFromPicks(picks);
    if (getWorkerUrl() && aiFinalists.length) {
      await runAllModels(aiFinalists, picks);
    }

  } catch (e) {
    st.err = e.message || 'Failed to fetch odds.';
  }

  st.scanning = false;
  st.loading = false;
  render();
}
function migrateSchemaV2() {
  if (LS.get('embet_schema_v2')) return;
  const now = Date.now();
  const fix = arr => (arr || []).map(p => {
    if (!p) return p;
    if (p.latestLine == null) p.latestLine = p.line;
    if (p.latestLineAt == null) p.latestLineAt = p.closingAt || null;
    if (p.closingLine != null) {
      const gameHasHappened = !isNaN(new Date(p.commenceTime).getTime()) && new Date(p.commenceTime).getTime() <= now;
      const commence = new Date(p.commenceTime).getTime();
      const closedAt = p.closingAt ? new Date(p.closingAt).getTime() : null;
      const strictlyProvenFinal = closedAt != null && !isNaN(commence) && closedAt >= commence;
      if (strictlyProvenFinal || gameHasHappened) {
        p.lineFinalized = true;
      } else {
        p.latestLine    = p.closingLine;
        p.latestLineAt  = p.closingAt || p.latestLineAt;
        p.closingLine   = null;
        p.closingAt     = null;
        p.lineFinalized = false;
      }
    } else {
      p.lineFinalized = false;
    }
    return p;
  });
  st.pending = fix(st.pending);
  st.history = fix(st.history);
  LS.set('embet_pending', st.pending);
  LS.set('embet_history', st.history);
  LS.set('embet_schema_v2', true);
}
// ---------------------------------------------------------------------------
// PHASE 0 -- schema v3 migration
//
// Runs once, after migrateSchemaV2(), over whatever is already in localStorage.
// Two things change shape, and both are handled without discarding data:
//
// 1. Edge units. Pre-patch `edge` held an EV fraction. fairProb and line were
//    both already persisted on every record, so the probability gap is
//    recomputed exactly rather than approximated. Records old enough to
//    predate fairProb get edge = null and simply drop out of the edge-bucket
//    table; they remain in every other table.
//
// 2. Closing-line provenance. Pre-patch, a genuine capture and a fabricated
//    fallback were written identically -- closingAt = now, lineFinalized =
//    true, no other marker -- so old rows genuinely cannot be told apart after
//    the fact. Rather than guess, they are marked 'legacy' and excluded from
//    CLV statistics. Nothing is deleted; the rows stay visible in Pick history
//    and can be re-admitted later if a rule for classifying them is found.
//
// The same reasoning applies to embet_model_perf, whose locked clv_pp values
// were written by the old fallback path.
// ---------------------------------------------------------------------------
function migrateSchemaV3() {
  if (LS.get('embet_schema_v3')) return;

  const fix = arr => (arr || []).map(p => {
    if (!p) return p;
    if (p.edgeProb === undefined) {
      p.edgeEV   = typeof p.edge === 'number' ? p.edge : null;
      p.edgeProb = (typeof p.fairProb === 'number' && typeof p.line === 'number')
        ? p.fairProb - iP(p.line)
        : null;
      p.edge = p.edgeProb;
    }
    if (p.closeSource === undefined) {
      p.closeSource = p.closingLine == null ? 'none' : 'legacy';
    }
    return p;
  });

  st.pending = fix(st.pending);
  st.history = fix(st.history);
  LS.set('embet_pending', st.pending);
  LS.set('embet_history', st.history);

  const perf = LS.get('embet_model_perf') || {};
  let perfChanged = false;
  for (const id in perf) {
    for (const rec of (perf[id]?.picks || [])) {
      if (rec.legacy === undefined) { rec.legacy = !!rec.clvLocked; perfChanged = true; }
    }
  }
  if (perfChanged) LS.set('embet_model_perf', perf);

  LS.set('embet_schema_v3', true);
}
function restoreBackupData(data) {
  for (const key of ['embet_history','embet_pending']) {
    if (data[key] !== undefined && (!Array.isArray(data[key]) || data[key].some(p =>
      !p || typeof p !== 'object' || typeof p.id !== 'string' || !validOdds(p.line) ||
      !Number.isFinite(Date.parse(p.commenceTime)) || ![null,undefined,'W','L','P','N'].includes(p.result))))
      throw new Error(`Invalid ${key}; original data left unchanged.`);
  }
  if (data.embet_layer_batches != null && !Array.isArray(data.embet_layer_batches)) throw new Error('Invalid batch log');
  for (const key of ['embet_settings','embet_model_perf']) if (data[key] != null &&
    (typeof data[key] !== 'object' || Array.isArray(data[key]))) throw new Error(`Invalid ${key}`);
  for (const m of Object.values(data.embet_model_perf || {})) {
    if (!m || !Array.isArray(m.picks) || m.picks.some(r => !r || typeof r !== 'object')) throw new Error('Invalid model records');
  }
  for (const b of data.embet_layer_batches || []) if (!b || typeof b !== 'object' ||
    (b.schemaVersion === 4 && (!Array.isArray(b.candidates) || !Number.isFinite(Date.parse(b.requestedAt))))) throw new Error('Invalid research batch');
  const settings = data.embet_settings || {};
  for (const [k,lo,hi] of [['minEdge',MIN_EDGE_FLOOR,MIN_EDGE_CEIL],['topN',TOP_N_FLOOR,TOP_N_CEIL],['maxOddsCap',MAX_ODDS_FLOOR,MAX_ODDS_CEIL]]) {
    if (settings[k] != null && (!Number.isFinite(settings[k]) || settings[k] < lo || settings[k] > hi)) throw new Error(`Invalid setting: ${k}`);
  }
  const values = {
    embet_history:data.embet_history ?? [], embet_pending:data.embet_pending ?? [],
    embet_settings:data.embet_settings ?? {}, embet_bankroll:data.embet_bankroll ?? null,
    embet_model_perf:data.embet_model_perf ?? {}, embet_layer_batches:data.embet_layer_batches ?? [],
    embet_ai_models:data.embet_ai_models ?? DEFAULT_AI_MODELS,
    embet_schema_v2:false,embet_schema_v3:false,embet_schema_v4:false
  };
  if (data.embet_worker_url && /^https:\/\//i.test(data.embet_worker_url)) values.embet_worker_url = data.embet_worker_url;
  if (!Array.isArray(values.embet_ai_models)) throw new Error('Invalid model selection');
  const keys = [...new Set([...Object.keys(values),...Object.keys(localStorage).filter(k => k.startsWith('embet_picks_'))])];
  const old = Object.fromEntries(keys.map(k => [k,localStorage.getItem(k)]));
  try {
    // Retain one recoverable pre-import dataset before replacing anything.
    localStorage.setItem('embet_before_import',JSON.stringify(old));
    for (const k of keys) {
      if (k in values) localStorage.setItem(k,JSON.stringify(values[k]));
      else localStorage.removeItem(k);
      delete mem[k];
    }
  } catch (err) {
    for (const k of keys) { try { old[k] == null ? localStorage.removeItem(k) : localStorage.setItem(k,old[k]); } catch {} }
    throw new Error('Browser storage could not save the import. Keep your backup file and free storage before retrying.');
  }
}

function migrateSchemaV4() {
  for (const p of [...st.pending,...st.history]) {
    if (!(p.entrySchema >= 4)) {
      if (!p.legacyEntry) p.legacyEntry = {fairProb:p.fairProb,edge:p.edge,edgeEV:p.edgeEV,edgeProb:p.edgeProb,confidence:p.confidence};
      p.entrySchema = 3; // original entry features cannot be proven immutable
      if (p.closeSource === 'captured') p.closeSource = 'legacy';
      if (p.closeSource == null) p.closeSource = p.closingLine == null ? 'none' : 'legacy';
    }
    if (Number.isFinite(p.fairProb) && validOdds(p.line)) {
      p.edgeProb = p.fairProb - iP(p.line); p.edgeEV = cEV(p.fairProb,p.line); p.edge = p.edgeProb;
    } else { p.edgeProb = null; p.edgeEV = null; p.edge = null; }
  }
  persistRecords();
  LS.set('embet_schema_v4',true);
}

let closeMaintenanceBusy = false;
async function maintainCloses() {
  if (!AK || closeMaintenanceBusy || st.scanning) return;
  closeMaintenanceBusy = true;
  try {
    const now = Date.now();
    const due = [...st.pending,...st.history].filter(p => p.closingLine == null &&
      Date.parse(p.commenceTime) > now && Date.parse(p.commenceTime) - now <= 10*60*1000);
    // Resolve legacy sport labels once, without truncating to discovery's eight sports.
    let sports = [];
    if (due.some(p => !p.sportKey)) {
      const r = await fetch(`${OB}/sports/?all=true&apiKey=${AK}`);
      if (!r.ok) throw new Error(`Close tracking: sports request ${r.status}`);
      sports = await r.json();
    }
    for (const p of due) if (!p.sportKey) p.sportKey = sports.find(s => s.title === p.sport)?.key;
    const grouped = new Map();
    for (const p of due) if (p.sportKey) {
      if (!grouped.has(p.sportKey)) grouped.set(p.sportKey,new Set());
      grouped.get(p.sportKey).add(p.gameId);
    }
    for (const [sport, ids] of grouped) {
      const url = new URL(`${OB}/sports/${sport}/odds/`);
      for (const [k,v] of Object.entries({apiKey:AK,bookmakers:BKS,markets:'h2h,spreads,totals',oddsFormat:'american',eventIds:[...ids].join(',')})) url.searchParams.set(k,v);
      const r = await fetch(url);
      if (!r.ok) throw new Error(`Close tracking request ${r.status}; will retry while the app is open.`);
      (await r.json()).forEach(captureClosing);
    }
    persistRecords();
  } catch (e) { st.err = e.message; }
  finally { finalizeStalePending(); closeMaintenanceBusy = false; render(); }
}

function maybeAutoBackup() {
  const lastBackupAt = LS.get('embet_last_backup');
  const hasData = st.history.length > 0 || st.pending.length > 0;
  const ageDays = lastBackupAt ? (Date.now() - new Date(lastBackupAt).getTime()) / 86400000 : Infinity;
  if (hasData && ageDays >= 7) {
    try { window.EL.exportBackup(); } catch (e) { /* banner reminder still covers this */ }
  }
}
function init() {
  const h = LS.get('embet_history');
  if (h) st.history = h;

  const pend = LS.get('embet_pending');
if (pend) st.pending = pend;

  migrateSchemaV2();
  migrateSchemaV3();
  migrateSchemaV4();
  // PHASE 0 (2.2): finalizeStalePending() used to run HERE, before scan().
  // captureClosing() only processes picks where closingLine == null, so the
  // fallback locked in an unverifiable value moments before the network call
  // that would have fetched the real one -- guaranteeing the fabricated close
  // won every time. scan() already calls finalizeStalePending() after the scan
  // loop (correctly placed), so this call is simply removed rather than moved.
  maybeAutoBackup();

  const br = LS.get('embet_bankroll');
  if (br) st.bankroll = br;

  const settings = LS.get('embet_settings');
  if (settings) st.settings = settings;

  st.workerUrl = getWorkerUrl();
  st.aiModels = getAiModels();

  const savedKey = LS.get('embet_ak');
  if (savedKey) {
    AK          = savedKey;
    st.keyReady = true;
  }

  if (!AK) {
    st.offlineHistory = st.history.length > 0 || st.pending.length > 0;
    st.loading = false;
    render();
    return;
  }

  maintainCloses();
  const cached = LS.get(PICKS_KEY());
  if (cached && 'near' in cached) {
    const toArr = v => Array.isArray(v) ? v : (v ? [v] : []);
    st.picks = { ...cached, near: toArr(cached.near), future: toArr(cached.future), flagged: cached.flagged || [] };
    st.loading = false;
    const age  = Date.now() - new Date(cached.generatedAt).getTime();
    if (age > STALE_MS) {
      st.loading = true;
      render();
      scan();
    } else {
      render();
    }
  } else {
    render();
    scan();
  }
}

<script>
/* =========================================================================
 * emBET Phase 1 — client sync module
 *
 * Drop-in. Paste this whole block as a new <script> immediately BEFORE the
 * closing </body> tag, after the existing app script. It touches the existing
 * code in four places, all by reassigning top-level function bindings — no
 * edits to the app's own source are required.
 *
 *   1. isCapturedClose()  — also accept server evidence (observed-pregame-v2,
 *                           wider window). v1 records keep their v1 rules.
 *   2. persistRecords()   — mark changed records dirty and schedule a push.
 *   3. settingsView()     — append a Sync panel.
 *   4. init()             — already ran; we pull once on load and re-render.
 *
 * Design rules (build plan §5), enforced here as well as on the server:
 *   - never delete a local record because the server did not return it
 *   - first sync pushes local state before trusting server state
 *   - a server-captured close outranks anything this browser produced
 *   - entry fields are never sent as edits; the server ignores them anyway
 * ========================================================================= */
(function () {
  'use strict';

  const SYNC_URL    = 'embet_sync_url';
  const SYNC_SECRET = 'embet_sync_secret';
  const SYNC_REV    = 'embet_sync_rev';
  const SYNC_SIGS   = 'embet_sync_sigs';
  const SYNC_PROXY  = 'embet_sync_proxy_odds';

  const syncUrl    = () => (LS.get(SYNC_URL) || '').replace(/\/+$/, '');
  const syncSecret = () => LS.get(SYNC_SECRET) || '';
  const syncOn     = () => !!(syncUrl() && syncSecret());

  const S = { busy: false, last: null, err: null, pulled: 0, pushed: 0, remapped: 0, deduped: 0, protected: 0, serverEmpty: null };
  window.EmbetSync = S;

  /* ---------------------------------------------------------------- dirty */
  // persistRecords() cannot tell us what changed, so we diff a cheap
  // signature per record. Entry fields are excluded deliberately: they are
  // immutable, so a change there is a bug, not something to replicate.
  const sig = p => [
    p.result ?? '', p.settledAt ?? '', p.closingLine ?? '', p.closeSource ?? '',
    p.closingAt ?? '', p.latestLine ?? '', p.latestLineAt ?? '',
    p.preClose?.quoteAt ?? '', p.deleted ? 1 : 0
  ].join('|');

  function dirtyIds() {
    const prev = LS.get(SYNC_SIGS) || {};
    const out = [];
    for (const p of [...st.pending, ...st.history]) {
      if (!p || !p.id) continue;
      if (prev[p.id] !== sig(p)) out.push(p.id);
    }
    return out;
  }
  function commitSigs(skip = new Set()) {
    const map = {};
    for (const p of [...st.pending, ...st.history])
      if (p && p.id && !skip.has(p.id)) map[p.id] = sig(p);
    LS.set(SYNC_SIGS, map);      // omitted ids read as dirty next time
  }

  /* ------------------------------------------------------------ transport */
  async function api(path, opts = {}) {
    const res = await fetch(syncUrl() + path, {
      method: opts.method || (opts.body ? 'POST' : 'GET'),
      headers: { 'authorization': 'Bearer ' + syncSecret(), 'content-type': 'application/json' },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Sync ${res.status}`);
    return data;
  }

  /* ------------------------------------------------------------- adapters */
  const OUT_DROP = new Set(['_sig']);
  function outbound(p) {
    const o = {};
    for (const k in p) if (!OUT_DROP.has(k)) o[k] = p[k];
    o.updatedAt = new Date().toISOString();
    return o;
  }

  // Server rows arrive already in client shape (the Worker's toClient()).
  // The one thing we must not do is trust a server row's `result` over a
  // local settle that has not been pushed yet — but /api/sync applies our
  // push before computing the response, so anything we get back already
  // reflects it.
  const natKey = p => `${p.gameId || p.game || '?'}|${p.mkt}|${p.bet}|${p.book}`;

  function applyServerRecords(rows, protect = new Set()) {
    if (!rows?.length) return 0;
    const byId = new Map();
    for (const p of st.pending) byId.set(p.id, { list: 'pending', rec: p });
    for (const p of st.history) byId.set(p.id, { list: 'history', rec: p });

    let n = 0;
    for (const row of rows) {
      if (row.deleted) continue;                  // soft deletes: leave local alone
      // Edited on this device while the request was in flight. The server's
      // copy predates that edit, so applying it would silently revert a
      // settle. Keep local; it stays dirty and pushes on the next cycle.
      if (protect.has(row.id)) continue;
      const hit = byId.get(row.id);
      const belongs = row.result ? 'history' : 'pending';
      if (!hit) {
        (belongs === 'history' ? st.history : st.pending).push(row);
        n++;
        continue;
      }
      // merge in place so object identity survives for anything holding a ref
      Object.assign(hit.rec, row);
      if (hit.list !== belongs) {
        if (belongs === 'history') {
          st.pending = st.pending.filter(x => x.id !== row.id);
          if (!st.history.some(x => x.id === row.id)) st.history.push(hit.rec);
        } else {
          st.history = st.history.filter(x => x.id !== row.id);
          if (!st.pending.some(x => x.id === row.id)) st.pending.push(hit.rec);
        }
      }
      n++;
    }

    // Self-heal: retire any local record that duplicates a canonical server
    // row under a different id. Record ids are generated per device, so the
    // same wager can exist locally under a name the server has never used.
    // Only a confirmed server row can displace a local one, so a record this
    // device created and has not yet pushed is never dropped.
    const canonical = new Map();
    for (const row of rows) if (!row.deleted) canonical.set(natKey(row), row.id);
    const drop = new Set();
    for (const p of [...st.pending, ...st.history]) {
      if (protect.has(p.id)) continue;            // never retire an unsaved edit
      const id = canonical.get(natKey(p));
      if (id && id !== p.id) drop.add(p.id);
    }
    if (drop.size) {
      st.pending = st.pending.filter(p => !drop.has(p.id));
      st.history = st.history.filter(p => !drop.has(p.id));
      S.deduped = drop.size;
    } else S.deduped = 0;

    return n;
  }

  function localModelPicks() {
    const perf = LS.get('embet_model_perf') || {};
    const out = [];
    for (const [modelId, d] of Object.entries(perf))
      for (const p of (d.picks || []))
        out.push({ modelId, pickId: p.pickId, modelName: d.modelName, date: p.date,
                   confidence: p.confidence, clv_pp: p.clv_pp,
                   clvLocked: !!p.clvLocked, legacy: !!p.legacy });
    return out;
  }

  /* ------------------------------------------------------------ the cycle */
  async function syncNow({ full = false, silent = false } = {}) {
    if (!syncOn() || S.busy) return;
    S.busy = true; S.err = null;
    try {
      const since = full ? 0 : (LS.get(SYNC_REV) || 0);
      const ids = new Set(full ? null : dirtyIds());
      const all = [...st.pending, ...st.history];
      const push = full ? all : all.filter(p => ids.has(p.id));

      // Settings are pushed only once this device has synced at least once.
      // A fresh device holds defaults, and pushing them on the first sync
      // overwrites the real settings already on the server -- the mirror
      // image of the never-wipe-local rule.
      const firstSync = !LS.get(SYNC_REV);
      const body = {
        since,
        records: push.map(outbound),
        ...(firstSync ? {} : {
          settings: {
            ...(LS.get('embet_settings') || {}),
            bankroll: LS.get('embet_bankroll') ?? null
          }
        }),
        layerBatches: LS.get('embet_layer_batches') || [],
        modelPicks: localModelPicks()
      };

      // Signature of every local record as it stood when the request left.
      // Anything that differs on return was edited while we were waiting.
      const inFlight = new Map();
      for (const p of all) inFlight.set(p.id, sig(p));

      const res = await api('/api/sync', { body });

      const protect = new Set();
      for (const p of [...st.pending, ...st.history]) {
        const before = inFlight.get(p.id);
        if (before !== undefined && before !== sig(p)) protect.add(p.id);
      }
      S.protected = protect.size;
      S.serverEmpty = res.serverEmptyBefore ?? res.serverEmpty;

      // The server may report that a record we pushed was actually the same
      // wager it already held under a different id — record ids are generated
      // per device, so the phone and the Mac name the same bet differently.
      // Drop our local duplicate; the canonical row arrives in this same
      // response and is added below.
      const remap = res.applied?.records?.idRemap || [];
      if (remap.length) {
        const drop = new Set(remap.map(r => r.from));
        st.pending = st.pending.filter(p => !drop.has(p.id));
        st.history = st.history.filter(p => !drop.has(p.id));
        S.remapped = remap.length;
      } else S.remapped = 0;
      S.pushed = push.length;
      S.pulled = applyServerRecords(res.records, protect);

      // settings: server is truth once it holds any
      if (res.settings && Object.keys(res.settings).length) {
        const next = { ...res.settings };
        if (next.bankroll != null) { st.bankroll = next.bankroll; LS.set('embet_bankroll', next.bankroll); }
        delete next.bankroll;
        if (Object.keys(next).length) { st.settings = { ...st.settings, ...next }; LS.set('embet_settings', st.settings); }
      }
      if (res.layerBatches?.length) {
        // A batch is written as "requested" and rewritten when the models
        // answer. Only adding unfamiliar batchKeys froze every batch at
        // whichever state this device happened to see first — and
        // studyBatches() only counts complete+eligible ones, so the Layer 1
        // vs Layer 2 comparison would have quietly collected nothing.
        const log = LS.get('embet_layer_batches') || [];
        const idx = new Map(log.map((b, i) => [b.batchKey, i]));
        const ahead = (a, b) => (a?.completedAt || '') > (b?.completedAt || '') ||
                                (!!a?.completedAt && !b?.completedAt);
        let changed = false;
        for (const b of res.layerBatches) {
          const i = idx.get(b.batchKey);
          if (i === undefined) { log.push(b); changed = true; }
          else if (ahead(b, log[i])) { log[i] = { ...log[i], ...b }; changed = true; }
        }
        if (changed) LS.set('embet_layer_batches', log);
      }

      persistRecordsRaw();
      commitSigs(protect);          // protected ids stay dirty on purpose
      LS.set(SYNC_REV, res.rev);
      if (protect.size) setTimeout(() => syncNow({ silent: true }), 800);
      S.last = new Date().toISOString();
    } catch (e) {
      S.err = e.message || String(e);
      if (!silent) st.err = `Sync: ${S.err}`;
    } finally {
      S.busy = false;
      render();
    }
  }
  S.syncNow = syncNow;

  /* -------------------------------------------------- 1. evidence version */
  // The Worker records `observed-pregame-v2` with a 30-minute window and an
  // ageMs field. The shipped client only accepts `observed-pregame-v1` inside
  // 5 minutes, so without this every server-captured close would be discarded
  // by the very validator that is supposed to protect the dataset.
  // v1 records keep the original 5-minute rule; nothing already verified changes.
  const V1_WINDOW = 5 * 60 * 1000;
  const V2_WINDOW = 30 * 60 * 1000;
  const _isCapturedClose = isCapturedClose;
  isCapturedClose = function (p) {
    const e = p?.closeEvidence;
    if (e?.method !== 'observed-pregame-v2') return _isCapturedClose(p);
    const start = Date.parse(p?.commenceTime);
    const quote = Date.parse(e.quoteAt), observed = Date.parse(e.observedAt);
    return p.closeSource === 'captured' &&
      validOdds(p.line) && validOdds(p.closingLine) && p.closingLine === e.price &&
      Number.isFinite(start) && Number.isFinite(quote) && Number.isFinite(observed) &&
      quote <= observed && quote < start && start - quote <= V2_WINDOW &&
      Date.now() >= start && e.gameId === p.gameId && e.mkt === p.mkt &&
      e.bet === p.bet && e.book === p.book;
  };
  S.windows = { v1: V1_WINDOW, v2: V2_WINDOW };

  /* --------------------------------- 5. stamp the threshold at detection */
  // Without this, a pick cannot be attributed to the minimum-edge setting
  // that produced it, so cohorts can't be separated after the dial moves.
  // Guarded: if a future build renames these, the module degrades instead of
  // throwing and taking sync down with it.
  if (typeof mergePending === 'function' && typeof minEdge === 'function') {
    const _mergePending = mergePending;
    mergePending = function (pick) {
      const out = _mergePending(pick);
      const stored = st.pending.find(p => p.gameId === pick.gameId && p.mkt === pick.mkt &&
                                          p.bet === pick.bet && p.book === pick.book);
      if (stored && stored.minEdgeAtEntry === undefined) {
        stored.minEdgeAtEntry = minEdge();
        if (out) out.minEdgeAtEntry = stored.minEdgeAtEntry;
      }
      // The tracker deliberately keeps the whole non-suspicious cohort,
      // including plays the odds cap hides from the recommendation list. That
      // is right for research and wrong for scoring: without knowing the cap
      // in force at entry, there is no way to separate "the scanner told me to
      // take this" from "the scanner recorded it and never showed me".
      if (stored && stored.maxOddsCapAtEntry === undefined &&
          typeof maxOddsCap === 'function') {
        stored.maxOddsCapAtEntry = maxOddsCap();       // null means no cap set
        if (out) out.maxOddsCapAtEntry = stored.maxOddsCapAtEntry;
      }
      return out;
    };
  }

  /* ------------------------------------------------- 2. persist -> push */
  const persistRecordsRaw = persistRecords;
  let pushTimer = null;
  persistRecords = function () {
    persistRecordsRaw();
    if (!syncOn()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => syncNow({ silent: true }), 1500);
  };

  /* ------------------------------------------------ 3. settings UI panel */
  const _settingsView = settingsView;
  settingsView = function () {
    const on = syncOn();
    const state = !on ? 'Not configured'
      : S.busy ? 'Syncing…'
      : S.err ? `Error: ${esc(S.err)}`
      : S.last ? `Last sync ${esc(fDT(S.last))} · pushed ${S.pushed}, pulled ${S.pulled}`
      : 'Configured, not yet synced';
    return _settingsView() + `
      <section class="panel">
        <h2>Device sync</h2>
        <p class="quiet">Shares one dataset between this browser and your phone, and lets the
        Worker capture closing lines while no browser is open. Records still live in this
        browser as a cache, so backups keep working exactly as before.</p>
        <label class="field">Sync Worker URL
          <input type="url" value="${attribute(syncUrl())}"
                 placeholder="https://embet-data.you.workers.dev"
                 onchange="EmbetSync.setUrl(this.value)"></label>
        <label class="field" style="margin-top:14px">Sync secret
          <input type="password" autocomplete="off" placeholder="EMBET_SYNC_SECRET"
                 onchange="EmbetSync.setSecret(this.value)"></label>
        <p class="quiet" style="margin-top:12px">${state}</p>
        <div class="record-actions">
          <button class="button primary" ${on ? '' : 'disabled'}
                  onclick="EmbetSync.syncNow({full:true})">Sync now</button>
          <button class="button" ${on ? '' : 'disabled'}
                  onclick="EmbetSync.check()">Check server</button>
        </div>
        <p class="quiet">The secret is stored in this browser only and is never written into
        backup files. Enter it once per device.</p>
      </section>` + gradesPanel();
  };

  /* ------------------------------------------------ 3b. model record panel */
  // Results used to arrive only by hand, which meant the 40 picks that were
  // never wagered could not be scored at all — the model's own record was
  // unmeasurable. The Worker now grades every finished pick from the final
  // score and keeps that grade separate from the wager ledger.
  const pct = v => (v == null ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%');
  const line = (label, r) => !r || !r.picks ? '' : `
    <tr><td>${esc(label)}</td><td>${r.picks}</td>
        <td>${r.W}-${r.L}${r.P ? '-' + r.P : ''}</td>
        <td>${r.netUnits > 0 ? '+' : ''}${r.netUnits.toFixed(2)}u</td>
        <td>${pct(r.roi)}</td></tr>`;

  function gradesPanel() {
    if (!syncOn()) return '';
    const g = S.grades;
    if (g === undefined) { setTimeout(loadGrades, 0); return ''; }
    if (g === null) return '';
    const p = g.performance || {};
    const errs = Object.entries(g.gradeErrors || {});
    return `
      <section class="panel">
        <h2>Model record</h2>
        <p class="quiet">Graded from final scores, not from what was bet. Flat one unit per pick,
        settled at the price on the ticket. Win rate is shown but is not the measure — most of
        these are underdogs, where losing most of the time is still profitable.</p>
        <table class="tbl"><thead><tr>
          <th>Set</th><th>Picks</th><th>W-L</th><th>Net</th><th>ROI</th>
        </tr></thead><tbody>
          ${line('Recommended — inside your odds cap', p.recommended)}
          ${line('Tracked only — cap hid these from you', p.trackedOnly)}
          ${line('All distinct picks (both of the above)', p.distinctPicks)}
          ${line('Only the ones you bet', p.wageredOnly)}
        </tbody></table>
        <p class="quiet" style="margin-top:8px">The scanner records every
        non-suspicious opportunity so the research cohort isn't filtered by what
        it chose to display — but it only recommends what clears your odds cap.
        Charging the model for longshots it never showed you is not a fair
        score, so those are on their own line. Basis: ${esc(p.capBasis || '—')}.</p>
        ${!p.byPrice?.length ? '' : `
        <h3 style="margin-top:18px">By price</h3>
        <p class="quiet">Break-even is the hit rate a price needs just to not
        lose money. A bucket of long shots going 0-for-13 is an ordinary
        weekend, not evidence — compare wins against expected, not against zero.</p>
        <table class="tbl"><thead><tr>
          <th>Price</th><th>Picks</th><th>W</th><th>Exp. W</th><th>Break-even</th><th>Net</th><th>ROI</th>
        </tr></thead><tbody>
          ${p.byPrice.map(b => `<tr>
            <td>${esc(b.bucket)}</td><td>${b.picks}</td><td>${b.W}</td>
            <td>${b.expectedWins.toFixed(1)}</td>
            <td>${(b.breakEvenHitRate * 100).toFixed(1)}%</td>
            <td>${b.netUnits > 0 ? '+' : ''}${b.netUnits.toFixed(2)}u</td>
            <td>${pct(b.roi)}</td></tr>`).join('')}
        </tbody></table>`}
        <p class="quiet" style="margin-top:10px">
          ${g.awaitingGrade} finished ${g.awaitingGrade === 1 ? 'pick' : 'picks'} awaiting a score
          ${errs.length ? '· ' + errs.map(([k, n]) => `${n} ${esc(k)}`).join(' · ') : ''}
          ${g.disagreements?.length
            ? `<br><b>${g.disagreements.length} of your entered results disagree with the final score.</b>
               Nothing was changed — check them.`
            : ''}
        </p>
        <div class="record-actions">
          <button class="button" onclick="EmbetSync.grade()">Grade now</button>
        </div>
      </section>`;
  }

  async function loadGrades() {
    try { S.grades = await api('/api/grades'); }
    catch { S.grades = null; }          // never let a reporting panel break settings
    render();
  }
  S.grade = async () => {
    try {
      await api('/api/grade/run?force=1', { method: 'POST' });
      S.grades = undefined;
      await loadGrades();
    } catch (e) { window.alert('Grading failed: ' + e.message); }
  };

  S.setUrl = v => { LS.set(SYNC_URL, String(v || '').trim().replace(/\/+$/, '')); render(); };
  S.setSecret = v => { LS.set(SYNC_SECRET, String(v || '').trim()); render(); };
  S.check = async () => {
    try {
      const h = await api('/api/health');
      st.err = '';
      window.alert(
        `Server OK\n\n` +
        `records: ${h.records}\n` +
        `results: ${JSON.stringify(h.byResult)}\n` +
        `closes: ${JSON.stringify(h.closeSource)}\n` +
        `odds requests today: ${h.oddsUsageToday?.requests ?? 0} / ${h.dailyCap}\n` +
        `last cron: ${h.lastCron ? h.lastCron.ran_at : 'never'}`
      );
    } catch (e) { window.alert('Server check failed: ' + e.message); }
  };

  /* ------------------------------------- 4. optional: route odds via Worker */
  // Off by default. When enabled, Odds API calls are rewritten to the Worker so
  // the key leaves this file. Turn it on only after sync is proven, because it
  // changes how scanning fetches.
  if (LS.get(SYNC_PROXY) && syncOn()) {
    const nativeFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      const url = typeof input === 'string' ? input : input?.url;
      if (url && url.startsWith('https://api.the-odds-api.com/v4')) {
        const u = new URL(url);
        const target = new URL(syncUrl() +
          (u.pathname.includes('/odds/') ? '/api/odds/events' : '/api/odds/sports'));
        if (u.pathname.includes('/odds/')) {
          target.searchParams.set('sport', u.pathname.split('/sports/')[1].split('/')[0]);
          for (const k of ['markets', 'eventIds', 'bookmakers'])
            if (u.searchParams.get(k)) target.searchParams.set(k, u.searchParams.get(k));
        } else if (u.searchParams.get('all')) target.searchParams.set('all', 'true');
        return nativeFetch(target.toString(), {
          headers: { authorization: 'Bearer ' + syncSecret() }
        });
      }
      return nativeFetch(input, init);
    };
  }

  /* ----------------------------------------------------------- first pull */
  if (syncOn()) {
    // Pull-then-merge on load. A full push goes with it, so an empty server
    // gets seeded from this browser rather than emptying it.
    setTimeout(() => syncNow({ full: !LS.get(SYNC_REV), silent: true }), 400);
    setInterval(() => { if (document.visibilityState === 'visible') syncNow({ silent: true }); }, 5 * 60 * 1000);

    // Belt and braces. The Worker's cron is registered and currently fires
    // nothing, which would mean no closes are captured at all. Poking the same
    // job from an open page is strictly worse than a cron — it only runs when a
    // device is awake — but it is far better than nothing, and it runs the
    // server-side capture rules rather than the weaker in-page ones. Harmless
    // once the cron works: the job is idempotent and short-circuits when
    // nothing is inside the lookahead window.
    const poke = () => {
      if (document.visibilityState !== 'visible') return;
      api('/api/cron/run', { method: 'POST' }).catch(() => {});
    };
    setTimeout(poke, 4000);
    setInterval(poke, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncNow({ silent: true });
    });
  }
})();
</script>
</body>
</html>
